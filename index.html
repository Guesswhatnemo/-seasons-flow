<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四季流转</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: min(375px, 100vw);
            height: min(100vh, 750px);
            max-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.05s;
        }

        /* ── Header ── */
        #header {
            flex-shrink: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 10;
        }
        #title { font-size: 20px; color: #ecf0f1; letter-spacing: 4px; font-weight: 600; }
        #score  { font-size: 18px; color: #ffd700; transition: transform 0.15s; }
        #score.pop { transform: scale(1.3); }

        /* ── Combo display ── */
        #comboDisplay {
            position: absolute;
            top: 58px; left: 0; right: 0;
            text-align: center;
            z-index: 60;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #comboDisplay.show { opacity: 1; }
        #comboText {
            font-size: 36px; font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 40px rgba(255,215,0,0.4);
        }
        #comboLabel { font-size: 13px; color: #ffd70090; letter-spacing: 2px; }

        /* ── Preview bar ── */
        #previewBar {
            flex-shrink: 0;
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            background: rgba(0,0,0,0.25);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            z-index: 10;
        }
        #previewCircle {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid rgba(255,255,255,0.3);
        }
        #previewCanvas { width: 36px; height: 36px; }
        #previewText { color: #888; font-size: 13px; }
        #previewName  { color: #ddd; font-size: 14px; font-weight: 600; margin-left: 4px; }
        #highLevel { color: #ffd700; font-size: 12px; margin-left: auto; }

        /* ── Game area ── */
        #gameArea {
            flex: 1;
            position: relative;
            overflow: hidden;
            margin: 0;
            border-radius: 0;
        }

        #gameCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        #bgCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        #clickLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            cursor: pointer;
        }

        /* Danger line */
        #dangerLine {
            position: absolute;
            top: 40px; left: 0; right: 0;
            height: 2px;
            background: repeating-linear-gradient(90deg, rgba(255,80,80,0.5) 0, rgba(255,80,80,0.5) 8px, transparent 8px, transparent 16px);
            z-index: 5;
            pointer-events: none;
        }

        /* ── Floating score ── */
        .floatScore {
            position: absolute;
            pointer-events: none;
            z-index: 70;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.6);
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
        }

        /* ── Merge announcement ── */
        #announce {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            z-index: 80;
            pointer-events: none;
            text-align: center;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #announce.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #announceSymbol { font-size: 48px; }
        #announceName { font-size: 22px; color: #fff; font-weight: 700; margin-top: 4px; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
        #announceScore { font-size: 16px; color: #ffd700; margin-top: 2px; }

        /* ── Annihilation overlay ── */
        #annihilateFlash {
            position: absolute; inset: 0;
            background: white;
            z-index: 90;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
        #annihilateFlash.flash { opacity: 0.8; }

        /* ── Footer ── */
        #footer {
            flex-shrink: 0;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 10;
        }
        .fbtn {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; cursor: pointer; color: #999;
            transition: background 0.2s;
        }
        .fbtn:hover { background: rgba(255,255,255,0.2); }

        /* ── Game Over ── */
        #gameOver {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        #gameOver.show { display: flex; }
        #goTitle { font-size: 28px; color: #ecf0f1; letter-spacing: 6px; margin-bottom: 16px; }
        #goScore  { font-size: 48px; color: #ffd700; margin-bottom: 10px; text-shadow: 0 0 24px rgba(255,215,0,0.5); }
        #goHighScore { font-size: 14px; color: #888; margin-bottom: 28px; }
        #restartBtn {
            padding: 14px 44px; font-size: 17px;
            font-family: inherit;
            background: linear-gradient(135deg, #a8e6cf, #81ecec);
            border: none; border-radius: 28px;
            color: #2c3e50; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #restartBtn:hover { transform: scale(1.05); }

        /* ── Help modal ── */
        #helpModal {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            padding: 30px;
        }
        #helpModal.show { display: flex; }
        #helpContent {
            background: rgba(40,40,70,0.95);
            border-radius: 16px;
            padding: 24px;
            max-width: 320px;
            color: #ddd;
            font-size: 14px;
            line-height: 1.8;
        }
        #helpContent h2 { color: #ffd700; margin-bottom: 12px; font-size: 18px; text-align: center; }
        #helpContent .row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
        #helpContent .dot { border-radius: 50%; flex-shrink: 0; }
        #helpClose {
            margin-top: 16px; padding: 10px 32px;
            font-family: inherit; font-size: 15px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px; color: #eee; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="header">
        <div id="title">四季流转</div>
        <div id="score">✿ <span id="scoreValue">0</span></div>
    </div>

    <div id="comboDisplay">
        <div id="comboText">x2</div>
        <div id="comboLabel">COMBO</div>
    </div>

    <div id="previewBar">
        <div id="previewCircle"><canvas id="previewCanvas" width="36" height="36"></canvas></div>
        <span id="previewText">下一个</span>
        <span id="previewName">种子</span>
        <span id="highLevel">最高: 种子</span>
    </div>

    <div id="gameArea">
        <canvas id="bgCanvas"></canvas>
        <div id="dangerLine"></div>
        <canvas id="gameCanvas"></canvas>
        <div id="clickLayer"></div>
        <div id="announce"><div id="announceSymbol"></div><div id="announceName"></div><div id="announceScore"></div></div>
        <div id="annihilateFlash"></div>
    </div>

    <div id="footer">
        <div class="fbtn" id="soundBtn">🔊</div>
        <div class="fbtn" id="helpBtn">❓</div>
    </div>

    <div id="gameOver">
        <div id="goTitle">落花时节</div>
        <div id="goScore">0</div>
        <div id="goHighScore">最高纪录: 0</div>
        <button id="restartBtn">重新开始</button>
    </div>

    <div id="helpModal">
        <div id="helpContent">
            <h2>游戏规则</h2>
            <p>点击屏幕掉落符号，相同符号碰撞合成为下一级。</p>
            <p style="margin-top:8px;">合成路线：</p>
            <div id="helpLevels"></div>
            <p style="margin-top:10px; color:#ffd700;">两个「雪晶」合成后消融消失，+2000分！</p>
            <p style="margin-top:4px; color:#ff8888;">连续合成触发 COMBO，分数翻倍！</p>
            <p style="margin-top:4px; color:#ff8888;">符号堆过虚线则游戏结束。</p>
        </div>
        <button id="helpClose">知道了</button>
    </div>
</div>

<script>
// Inline Matter.js
matterScript.src = 'matter.min.js';
matterScript.onload = startGame;
document.head.appendChild(matterScript);

// Fallback: if local file doesn't load, try CDN
matterScript.onerror = function() {
    this.onerror = null;
    this.src = 'https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js';
};

function startGame() {
const { Engine, Runner, Bodies, Composite, Events } = Matter;

/* ── Season definitions (scores x10) ── */
const SEASONS = [
    { name: '种子',  radius: 14,  color: '#a8e6cf', dark: '#5cb87a', shape: 'seed',    score: 10 },
    { name: '嫩芽',  radius: 20,  color: '#7dcea0', dark: '#3d9b6a', shape: 'sprout',  score: 30 },
    { name: '花蕾',  radius: 27,  color: '#f8b4c4', dark: '#d87a96', shape: 'bud',     score: 60 },
    { name: '花朵',  radius: 35,  color: '#ff6b6b', dark: '#cc3333', shape: 'flower',  score: 100 },
    { name: '果实',  radius: 44,  color: '#f5a623', dark: '#c47d10', shape: 'fruit',   score: 150 },
    { name: '落叶',  radius: 54,  color: '#e67e22', dark: '#b35c0a', shape: 'leaf',    score: 210 },
    { name: '霜花',  radius: 64,  color: '#bdc3c7', dark: '#8a9299', shape: 'frost',   score: 280 },
    { name: '雪晶',  radius: 75,  color: '#ecf0f1', dark: '#b0b8c0', shape: 'crystal', score: 360 }
];

/* ── State ── */
var engine, runner;
var score = 0, nextLevel = 1, canDrop = true, gameRunning = true, soundOn = true;
var CW, CH;
var combo = 0, comboTimer = null, highestLevel = 0, highestScore = 0;
var fxList = [];
var bgHue = 220;

// Load high score
try { highestScore = parseInt(localStorage.getItem('seasonsHighScore')) || 0; } catch(e){}

/* ── Audio (synthesized) ── */
var audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playTone(freq, duration, volume, type) {
    if (!soundOn || !audioCtx) return;
    try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.3));
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + (duration || 0.3));
    } catch(e){}
}

function playMergeSound(level) {
    var baseFreq = 300 + level * 80;
    playTone(baseFreq, 0.15, 0.12, 'sine');
    setTimeout(function(){ playTone(baseFreq * 1.5, 0.1, 0.08, 'sine'); }, 50);
}

function playComboSound(combo) {
    var freq = 400 + combo * 100;
    playTone(freq, 0.2, 0.15, 'triangle');
}

function playAnnihilateSound() {
    playTone(200, 0.5, 0.2, 'sawtooth');
    setTimeout(function(){ playTone(600, 0.4, 0.15, 'sine'); }, 100);
    setTimeout(function(){ playTone(800, 0.3, 0.1, 'sine'); }, 200);
}

/* ── Shape drawing ── */
function drawShape(ctx, shape, cx, cy, r, color, dark) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.shadowColor = color;
    ctx.shadowBlur = r * 0.6;
    switch (shape) {
        case 'seed': drawSeed(ctx, r, color, dark); break;
        case 'sprout': drawSprout(ctx, r, color, dark); break;
        case 'bud': drawBud(ctx, r, color, dark); break;
        case 'flower': drawFlower(ctx, r, color, dark); break;
        case 'fruit': drawFruit(ctx, r, color, dark); break;
        case 'leaf': drawLeaf(ctx, r, color, dark); break;
        case 'frost': drawFrost(ctx, r, color, dark); break;
        case 'crystal': drawCrystal(ctx, r, color, dark); break;
    }
    ctx.restore();
}

function drawSeed(ctx, r, c, d) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = d; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = d; ctx.fill();
}
function drawSprout(ctx, r, c, d) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = d; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, r * 0.3); ctx.lineTo(0, -r * 0.6);
    ctx.strokeStyle = d; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.3, r * 0.25, r * 0.12, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = '#5cb87a'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.3, -r * 0.5, r * 0.25, r * 0.12, Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = '#5cb87a'; ctx.fill();
}
function drawBud(ctx, r, c, d) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = d; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r * 0.35, r * 0.1);
    ctx.quadraticCurveTo(-r * 0.4, -r * 0.6, 0, -r * 0.7);
    ctx.quadraticCurveTo(r * 0.4, -r * 0.6, r * 0.35, r * 0.1);
    ctx.fillStyle = d; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, r * 0.1); ctx.lineTo(0, r * 0.7);
    ctx.strokeStyle = '#5cb87a'; ctx.lineWidth = 2.5; ctx.stroke();
}
function drawFlower(ctx, r, c, d) {
    for (var i = 0; i < 5; i++) {
        ctx.save(); ctx.rotate(i * Math.PI * 2 / 5);
        ctx.beginPath(); ctx.ellipse(0, -r * 0.45, r * 0.28, r * 0.45, 0, 0, Math.PI * 2);
        ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = d; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd700'; ctx.fill();
}
function drawFruit(ctx, r, c, d) {
    ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = d; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -r * 0.6, r * 0.25, 0, Math.PI, true);
    ctx.fillStyle = d; ctx.globalAlpha = 0.3; ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(0, -r * 0.75); ctx.lineTo(r * 0.1, -r * 0.95);
    ctx.strokeStyle = '#6b3a1f'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.2, r * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
}
function drawLeaf(ctx, r, c, d) {
    ctx.beginPath();
    for (var i = 0; i < 5; i++) {
        var angle = -Math.PI / 2 + i * Math.PI * 2 / 5;
        var ox = Math.cos(angle) * r * 0.9, oy = Math.sin(angle) * r * 0.9;
        var midAngle = angle + Math.PI / 5;
        var mx = Math.cos(midAngle) * r * 0.35, my = Math.sin(midAngle) * r * 0.35;
        if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
        ctx.lineTo(mx, my);
    }
    ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = d; ctx.lineWidth = 2; ctx.stroke();
    for (var j = 0; j < 5; j++) {
        var a2 = -Math.PI / 2 + j * Math.PI * 2 / 5;
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a2) * r * 0.55, Math.sin(a2) * r * 0.55);
        ctx.strokeStyle = d; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.4; ctx.stroke();
    }
    ctx.globalAlpha = 1;
}
function drawFrost(ctx, r, c, d) {
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
        var angle = i * Math.PI / 3 - Math.PI / 6;
        var x = Math.cos(angle) * r * 0.85, y = Math.sin(angle) * r * 0.85;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = d; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    for (var j = 0; j < 6; j++) {
        var a = j * Math.PI / 3;
        var x2 = Math.cos(a) * r * 0.4, y2 = Math.sin(a) * r * 0.4;
        if (j === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.closePath(); ctx.strokeStyle = d; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4; ctx.stroke(); ctx.globalAlpha = 1;
    for (var k = 0; k < 6; k++) {
        var a3 = k * Math.PI / 3;
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a3) * r * 0.85, Math.sin(a3) * r * 0.85);
        ctx.strokeStyle = d; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.3; ctx.stroke();
    }
    ctx.globalAlpha = 1;
}
function drawCrystal(ctx, r, c, d) {
    ctx.beginPath(); ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
    ctx.fillStyle = c + '30'; ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.stroke();
    for (var i = 0; i < 6; i++) {
        var angle = i * Math.PI / 3;
        var ex = Math.cos(angle) * r * 0.85, ey = Math.sin(angle) * r * 0.85;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ex, ey);
        ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.stroke();
        for (var b = 0.35; b <= 0.65; b += 0.3) {
            var bx = Math.cos(angle) * r * b, by = Math.sin(angle) * r * b;
            var bl = r * 0.2;
            ctx.beginPath(); ctx.moveTo(bx, by);
            ctx.lineTo(bx + Math.cos(angle + 0.5) * bl, by + Math.sin(angle + 0.5) * bl); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(bx, by);
            ctx.lineTo(bx + Math.cos(angle - 0.5) * bl, by + Math.sin(angle - 0.5) * bl); ctx.stroke();
        }
    }
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.15); ctx.lineTo(r * 0.15, 0);
    ctx.lineTo(0, r * 0.15); ctx.lineTo(-r * 0.15, 0); ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
}

/* ── FX system ── */
function addGlow(x, y, color, size) { fxList.push({ x: x, y: y, r: size, color: color, t: 0, maxT: 25, type: 'glow' }); }
function addBurst(x, y, color, count, speed) {
    for (var i = 0; i < count; i++) {
        var angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
        var spd = speed * (0.7 + Math.random() * 0.6);
        fxList.push({ x: x, y: y, r: 3 + Math.random() * 3, color: color, t: 0, maxT: 30, type: 'particle',
            vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd });
    }
}
function addAnnihilation(x, y) {
    fxList.push({ x: x, y: y, r: 120, color: '#fff', t: 0, maxT: 40, type: 'flash' });
    for (var i = 0; i < 24; i++) {
        var angle = (i / 24) * Math.PI * 2;
        var spd = 4 + Math.random() * 5;
        fxList.push({ x: x, y: y, r: 4 + Math.random() * 5, color: '#ecf0f1', t: 0, maxT: 40, type: 'particle',
            vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd });
    }
    // Crystal shards
    for (var j = 0; j < 8; j++) {
        var a2 = (j / 8) * Math.PI * 2 + Math.random();
        fxList.push({ x: x, y: y, r: 8 + Math.random() * 6, color: '#ffd700', t: 0, maxT: 35, type: 'shard',
            vx: Math.cos(a2) * (3 + Math.random() * 3), vy: Math.sin(a2) * (3 + Math.random() * 3) - 2 });
    }
}

function drawFx(ctx) {
    fxList = fxList.filter(function(fx){ return fx.t < fx.maxT; });
    for (var i = 0; i < fxList.length; i++) {
        var fx = fxList[i];
        var p = fx.t / fx.maxT;
        ctx.save();
        if (fx.type === 'glow') {
            var s = 0.5 + p * 2.5;
            ctx.globalAlpha = (1 - p) * 0.8;
            ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r * s, 0, Math.PI * 2);
            ctx.fillStyle = fx.color; ctx.fill();
        } else if (fx.type === 'flash') {
            var s2 = 0.2 + p * 3;
            ctx.globalAlpha = (1 - p) * 0.7;
            var grad = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, fx.r * s2);
            grad.addColorStop(0, 'rgba(255,255,255,0.9)');
            grad.addColorStop(0.3, 'rgba(236,240,241,0.5)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(fx.x - fx.r * 4, fx.y - fx.r * 4, fx.r * 8, fx.r * 8);
        } else if (fx.type === 'particle') {
            fx.x += fx.vx; fx.y += fx.vy;
            ctx.globalAlpha = 1 - p;
            ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r * (1 - p * 0.3), 0, Math.PI * 2);
            ctx.fillStyle = fx.color; ctx.shadowColor = fx.color; ctx.shadowBlur = 6;
            ctx.fill();
        } else if (fx.type === 'shard') {
            fx.x += fx.vx; fx.y += fx.vy; fx.vy += 0.1;
            ctx.globalAlpha = 1 - p;
            ctx.translate(fx.x, fx.y); ctx.rotate(fx.t * 0.2);
            ctx.fillStyle = fx.color; ctx.shadowColor = fx.color; ctx.shadowBlur = 8;
            ctx.fillRect(-fx.r / 2, -fx.r / 4, fx.r, fx.r / 2);
        }
        ctx.restore();
        fx.t++;
    }
}

/* ── Screen shake ── */
function shake(intensity, duration) {
    var el = document.getElementById('gameContainer');
    var start = Date.now();
    function doShake() {
        var elapsed = Date.now() - start;
        if (elapsed > duration) { el.style.transform = ''; return; }
        var decay = 1 - elapsed / duration;
        var dx = (Math.random() - 0.5) * intensity * decay;
        var dy = (Math.random() - 0.5) * intensity * decay;
        el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        requestAnimationFrame(doShake);
    }
    doShake();
}

/* ── Floating score ── */
function showFloatScore(x, y, points, size) {
    var area = document.getElementById('gameArea');
    var div = document.createElement('div');
    div.className = 'floatScore';
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    div.style.fontSize = (size || 20) + 'px';
    div.textContent = '+' + points;
    area.appendChild(div);
    setTimeout(function(){ div.remove(); }, 1000);
}

/* ── Combo system ── */
function addCombo() {
    combo++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function(){ combo = 0; hideCombo(); }, 2000);
    if (combo >= 2) {
        playComboSound(combo);
        var cd = document.getElementById('comboDisplay');
        document.getElementById('comboText').textContent = 'x' + combo;
        cd.classList.add('show');
        // Pulse animation
        document.getElementById('comboText').style.transform = 'scale(1.3)';
        setTimeout(function(){ document.getElementById('comboText').style.transform = 'scale(1)'; }, 100);
    }
}
function hideCombo() {
    document.getElementById('comboDisplay').classList.remove('show');
}

/* ── Merge announcement ── */
function showAnnounce(level) {
    if (level < 4) return; // Only announce level 4+
    var s = SEASONS[level - 1];
    var el = document.getElementById('announce');
    document.getElementById('announceSymbol').textContent = s.symbol || '';
    document.getElementById('announceName').textContent = s.name + '！';
    document.getElementById('announceName').style.color = s.color;
    document.getElementById('announceScore').textContent = '';
    el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 1200);
}

/* ── Score pop ── */
function popScore() {
    var el = document.getElementById('score');
    el.classList.add('pop');
    setTimeout(function(){ el.classList.remove('pop'); }, 150);
}

/* ── Background ── */
var bgCanvas, bgCtx;
function drawBackground() {
    if (!bgCtx) return;
    var g = bgCtx.createLinearGradient(0, 0, 0, CH);
    // Hue shifts based on highest level
    var h1 = 220 - highestLevel * 15;
    var h2 = 240 - highestLevel * 10;
    g.addColorStop(0, 'hsl(' + h1 + ',30%,8%)');
    g.addColorStop(0.5, 'hsl(' + ((h1+h2)/2) + ',25%,12%)');
    g.addColorStop(1, 'hsl(' + h2 + ',20%,6%)');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0, 0, CW, CH);

    // Subtle stars
    bgCtx.fillStyle = 'rgba(255,255,255,0.3)';
    for (var i = 0; i < 40; i++) {
        var sx = (Math.sin(i * 127.1 + 311.7) * 0.5 + 0.5) * CW;
        var sy = (Math.cos(i * 269.5 + 183.3) * 0.5 + 0.5) * CH;
        var twinkle = Math.sin(Date.now() * 0.002 + i) * 0.5 + 0.5;
        bgCtx.globalAlpha = 0.1 + twinkle * 0.3;
        bgCtx.beginPath(); bgCtx.arc(sx, sy, 1 + twinkle, 0, Math.PI * 2); bgCtx.fill();
    }
    bgCtx.globalAlpha = 1;
}

/* ── Init ── */
function init() {
    var area = document.getElementById('gameArea');
    var canvas = document.getElementById('gameCanvas');
    bgCanvas = document.getElementById('bgCanvas');
    CW = area.clientWidth;
    CH = area.clientHeight;
    canvas.width = CW; canvas.height = CH;
    bgCanvas.width = CW; bgCanvas.height = CH;
    bgCtx = bgCanvas.getContext('2d');

    engine = Engine.create({ gravity: { x: 0, y: 0.8 } });
    window._engine = engine;

    var wallOpts = { isStatic: true, friction: 0.5, restitution: 0.1, label: 'wall' };
    Composite.add(engine.world, [
        Bodies.rectangle(CW / 2, CH + 15, CW + 40, 30, wallOpts),
        Bodies.rectangle(-15, CH / 2, 30, CH + 40, wallOpts),
        Bodies.rectangle(CW + 15, CH / 2, 30, CH + 40, wallOpts)
    ]);

    Events.on(engine, 'collisionStart', onCollision);

    var clickLayer = document.getElementById('clickLayer');
    clickLayer.addEventListener('click', function(e) { onDrop(e); });
    clickLayer.addEventListener('touchstart', function(e) { e.preventDefault(); onDrop(e.touches[0]); }, { passive: false });

    document.getElementById('soundBtn').addEventListener('click', function(e) {
        e.stopPropagation(); initAudio(); soundOn = !soundOn;
        e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
    });
    document.getElementById('helpBtn').addEventListener('click', function(e) {
        e.stopPropagation(); document.getElementById('helpModal').classList.add('show');
    });
    document.getElementById('helpClose').addEventListener('click', function() {
        document.getElementById('helpModal').classList.remove('show');
    });
    document.getElementById('restartBtn').addEventListener('click', restartGame);

    buildHelp();
    runner = Runner.create();
    Runner.run(runner, engine);
    updatePreview();
    requestAnimationFrame(loop);
}

function buildHelp() {
    var el = document.getElementById('helpLevels');
    el.innerHTML = SEASONS.map(function(s) {
        return '<div class="row"><span class="dot" style="width:' + Math.max(10, s.radius * 0.5) + 'px;height:' + Math.max(10, s.radius * 0.5) + 'px;background:' + s.color + ';border:1px solid ' + s.dark + '"></span> ' + s.name + '</div>';
    }).join(' → ');
}

/* ── Drop ── */
function onDrop(e) {
    if (!gameRunning || !canDrop) return;
    initAudio();
    var rect = document.getElementById('gameArea').getBoundingClientRect();
    var x = e.clientX - rect.left;
    var s = SEASONS[nextLevel - 1];
    if (x < s.radius + 5 || x > CW - s.radius - 5) return;

    var body = Bodies.circle(x, s.radius + 5, s.radius, {
        friction: 0.3, restitution: 0.15, density: 0.002,
        label: 'season_' + nextLevel,
        plugin: { level: nextLevel, merged: false, born: Date.now() }
    });
    Composite.add(engine.world, body);

    // Drop sound
    playTone(200 + nextLevel * 40, 0.08, 0.05, 'sine');

    canDrop = false;
    setTimeout(function(){ canDrop = true; }, 900);

    var rnd = Math.random();
    if (rnd < 0.45) nextLevel = 1 + Math.floor(Math.random() * 2);
    else if (rnd < 0.80) nextLevel = 2 + Math.floor(Math.random() * 2);
    else nextLevel = 3;
    updatePreview();
}

/* ── Collision ── */
function onCollision(event) {
    var pairs = event.pairs;
    for (var i = 0; i < pairs.length; i++) {
        var a = pairs[i].bodyA, b = pairs[i].bodyB;
        if (!a.label.startsWith('season_') || !b.label.startsWith('season_')) continue;
        if (a.plugin.merged || b.plugin.merged) continue;
        if (a.plugin.level !== b.plugin.level) continue;

        a.plugin.merged = true;
        b.plugin.merged = true;
        var lv = a.plugin.level;
        var mx = (a.position.x + b.position.x) / 2;
        var my = (a.position.y + b.position.y) / 2;

        // Add combo
        addCombo();
        var comboMult = Math.max(1, combo);

        if (lv === 8) {
            // Annihilation!
            var annihilateScore = 2000 * comboMult;
            score += annihilateScore;
            addAnnihilation(mx, my);
            shake(12, 400);
            playAnnihilateSound();
            showFloatScore(mx, my, annihilateScore, 36);

            // Full screen flash
            var flash = document.getElementById('annihilateFlash');
            flash.classList.add('flash');
            setTimeout(function(){ flash.classList.remove('flash'); }, 150);

            setTimeout(function(){ Composite.remove(engine.world, a); Composite.remove(engine.world, b); }, 50);
        } else {
            var nl = lv + 1;
            var ns = SEASONS[nl - 1];
            var nb = Bodies.circle(mx, my, ns.radius, {
                friction: 0.3, restitution: 0.15, density: 0.002,
                label: 'season_' + nl,
                plugin: { level: nl, merged: false, born: Date.now() }
            });
            var mergeScore = ns.score * comboMult;
            score += mergeScore;

            // Effects based on level
            addGlow(mx, my, ns.color, ns.radius * 1.5);
            addBurst(mx, my, ns.color, 8 + nl * 3, 2 + nl * 0.5);

            playMergeSound(nl);
            showFloatScore(mx, my, mergeScore, 14 + nl * 3);

            // Screen shake for level 5+
            if (nl >= 5) shake(3 + nl, 150 + nl * 30);

            // Announcement for level 4+
            showAnnounce(nl);

            // Update highest level
            if (nl > highestLevel) {
                highestLevel = nl;
                document.getElementById('highLevel').textContent = '最高: ' + SEASONS[highestLevel - 1].name;
            }

            setTimeout(function(){
                Composite.remove(engine.world, a);
                Composite.remove(engine.world, b);
                Composite.add(engine.world, nb);
            }, 50);
        }
        document.getElementById('scoreValue').textContent = score;
        popScore();
    }
}

/* ── Preview ── */
function updatePreview() {
    var s = SEASONS[nextLevel - 1];
    document.getElementById('previewName').textContent = s.name;
    var pc = document.getElementById('previewCanvas');
    var pctx = pc.getContext('2d');
    pctx.clearRect(0, 0, 36, 36);
    var scale = Math.min(16 / s.radius, 1);
    pctx.save();
    pctx.scale(scale, scale);
    drawShape(pctx, s.shape, s.radius, s.radius, s.radius, s.color, s.dark);
    pctx.restore();
}

/* ── Game Over ── */
function checkGameOver() {
    var now = Date.now();
    var bodies = Composite.allBodies(engine.world);
    for (var i = 0; i < bodies.length; i++) {
        var b = bodies[i];
        if (!b.label.startsWith('season_')) continue;
        var age = now - (b.plugin.born || 0);
        if (age < 2000) continue;
        if (b.position.y < 50 && Math.abs(b.velocity.y) < 1) return true;
    }
    return false;
}

/* ── Main loop ── */
function loop() {
    if (!gameRunning) return;

    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, CW, CH);

    // Background
    drawBackground();

    // Danger zone
    ctx.fillStyle = 'rgba(255,50,50,0.03)';
    ctx.fillRect(0, 0, CW, 40);

    // Bodies
    var bodies = Composite.allBodies(engine.world);
    for (var i = 0; i < bodies.length; i++) {
        var body = bodies[i];
        if (!body.label.startsWith('season_')) continue;
        var lv = body.plugin.level;
        var s = SEASONS[lv - 1];
        drawShape(ctx, s.shape, body.position.x, body.position.y, s.radius, s.color, s.dark);
    }

    // FX
    drawFx(ctx);

    // Game over check
    if (!canDrop && checkGameOver()) {
        gameRunning = false;
        // Save high score
        if (score > highestScore) {
            highestScore = score;
            try { localStorage.setItem('seasonsHighScore', highestScore); } catch(e){}
        }
        document.getElementById('goScore').textContent = score;
        document.getElementById('goHighScore').textContent = '最高纪录: ' + highestScore;
        document.getElementById('gameOver').classList.add('show');
        return;
    }

    requestAnimationFrame(loop);
}

/* ── Restart ── */
function restartGame() {
    var bodies = Composite.allBodies(engine.world);
    for (var i = 0; i < bodies.length; i++) {
        if (bodies[i].label.startsWith('season_')) Composite.remove(engine.world, bodies[i]);
    }
    score = 0; nextLevel = 1 + Math.floor(Math.random() * 2); canDrop = true; gameRunning = true;
    fxList = []; combo = 0; highestLevel = 0;
    document.getElementById('scoreValue').textContent = 0;
    document.getElementById('highLevel').textContent = '最高: 种子';
    document.getElementById('gameOver').classList.remove('show');
    hideCombo();
    updatePreview();
    requestAnimationFrame(loop);
}

/* ── Resize ── */
function onResize() {
    var area = document.getElementById('gameArea');
    CW = area.clientWidth; CH = area.clientHeight;
    document.getElementById('gameCanvas').width = CW;
    document.getElementById('gameCanvas').height = CH;
    document.getElementById('bgCanvas').width = CW;
    document.getElementById('bgCanvas').height = CH;
    var all = Composite.allBodies(engine.world);
    for (var i = 0; i < all.length; i++) {
        if (all[i].label === 'wall') Composite.remove(engine.world, all[i]);
    }
    var wo = { isStatic: true, friction: 0.5, restitution: 0.1, label: 'wall' };
    Composite.add(engine.world, [
        Bodies.rectangle(CW / 2, CH + 15, CW + 40, 30, wo),
        Bodies.rectangle(-15, CH / 2, 30, CH + 40, wo),
        Bodies.rectangle(CW + 15, CH / 2, 30, CH + 40, wo)
    ]);
}

window.addEventListener('load', init);
window.addEventListener('resize', onResize);
} // end startGame
</script>
